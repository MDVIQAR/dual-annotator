name: Build and Release DualAnnotator

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller==6.11.1
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # No more manual VC++ DLL copying needed.
      # collect_all("torch") in the spec grabs them from the torch wheel.
      # The runtime hook + main.py preloader handle DLL search paths at runtime.

      - name: Copy all torch DLLs to staging folder
        run: |
          $torchLib = python -c "import torch, os; print(os.path.join(os.path.dirname(torch.__file__), 'lib'))"
          Write-Host "Torch lib directory: $torchLib"
          Write-Host "DLLs in torch/lib:"
          Get-ChildItem "$torchLib\*.dll" | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
          New-Item -ItemType Directory -Force -Path "torch_dlls"
          Copy-Item "$torchLib\*.dll" -Destination "torch_dlls\" -Force

      - name: Build with spec file
        run: |
          pyinstaller DualAnnotator.spec

      - name: Zip folder version
        run: |
          Compress-Archive -Path dist\DualAnnotator -DestinationPath dist\DualAnnotator-folder.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DualAnnotator-folder.zip
          body: |
            ## DualAnnotator ${{ github.ref_name }}

            ### How to install
            1. Download **DualAnnotator-folder.zip**
            2. Extract the zip anywhere (e.g. Desktop)
            3. Open the extracted folder and double-click **DualAnnotator.exe**

            ### Requirements
            - Windows 10 or later
            - **Google Drive Desktop** must be installed and the shared drive mounted
