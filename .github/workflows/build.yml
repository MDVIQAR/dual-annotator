name: Build and Release DualAnnotator

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Copy VC++ runtime DLLs for bundling
        run: |
          Copy-Item "C:\Windows\System32\vcruntime140.dll"   -Destination vcruntime140.dll
          Copy-Item "C:\Windows\System32\vcruntime140_1.dll" -Destination vcruntime140_1.dll
          Copy-Item "C:\Windows\System32\msvcp140.dll"       -Destination msvcp140.dll

      - name: Build folder version
        run: |
          pyinstaller --onedir --windowed --name DualAnnotator `
            --collect-all torch `
            --collect-all torchvision `
            --collect-all ultralytics `
            --collect-all segmentation_models_pytorch `
            --collect-all albumentations `
            --collect-all onnxscript `
            --exclude-module onnxscript.version_converter `
            --hidden-import pytorch_lightning `
            --hidden-import torchmetrics `
            --hidden-import onnxruntime `
            --exclude-module onnx.reference `
            --add-data "mlops/scripts;mlops/scripts" `
            --add-binary "vcruntime140.dll;." `
            --add-binary "vcruntime140_1.dll;." `
            --add-binary "msvcp140.dll;." `
            main.py

      - name: Zip folder version
        run: |
          Compress-Archive -Path dist\DualAnnotator -DestinationPath dist\DualAnnotator-folder.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DualAnnotator-folder.zip
          body: |
            ## DualAnnotator ${{ github.ref_name }}

            ### How to install:
            1. Download **DualAnnotator-folder.zip**
            2. Extract the zip anywhere (e.g. Desktop)
            3. Open the extracted folder and double-click **DualAnnotator.exe**

            ### Requirements (for training to work):
            1. **Google Drive Desktop** must be installed and the shared drive must be mounted (the app saves trained models there).
