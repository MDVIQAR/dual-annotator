name: Build and Release DualAnnotator

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Build single .exe (portable)
        run: |
          pyinstaller --onefile --windowed --name DualAnnotator-portable `
            --collect-all torch `
            --collect-all torchvision `
            --collect-all ultralytics `
            --collect-all segmentation_models_pytorch `
            --collect-all albumentations `
            --collect-all onnxscript `
            --hidden-import pytorch_lightning `
            --hidden-import torchmetrics `
            --hidden-import onnxruntime `
            --exclude-module onnx.reference `
            --add-data "mlops/scripts;mlops/scripts" `
            main.py

      - name: Build folder version
        run: |
          pyinstaller --onedir --windowed --name DualAnnotator `
            --collect-all torch `
            --collect-all torchvision `
            --collect-all ultralytics `
            --collect-all segmentation_models_pytorch `
            --collect-all albumentations `
            --collect-all onnxscript `
            --hidden-import pytorch_lightning `
            --hidden-import torchmetrics `
            --hidden-import onnxruntime `
            --exclude-module onnx.reference `
            --add-data "mlops/scripts;mlops/scripts" `
            main.py

      - name: Zip folder version
        run: |
          Compress-Archive -Path dist\DualAnnotator -DestinationPath dist\DualAnnotator-folder.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DualAnnotator-portable.exe
            dist/DualAnnotator-folder.zip
          body: |
            ## DualAnnotator ${{ github.ref_name }}

            ### Download Options:
            - **DualAnnotator-portable.exe** — Single file, no install needed. Just double-click.
            - **DualAnnotator-folder.zip** — Extract and run. Faster launch time.

            ### First time? Read this first:
            Download the portable `.exe` — simplest option.

            ### Requirements (for training to work):
            1. **Google Drive Desktop** must be installed and the shared drive must be mounted (the app saves trained models there).
            2. **Microsoft Visual C++ Redistributable** — install it if torch fails to load: https://aka.ms/vs/17/release/vc_redist.x64.exe
