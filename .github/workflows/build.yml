name: Build and Release DualAnnotator

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller==6.11.1
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # Note: torch is installed in CI ONLY so PyInstaller can trace imports
      # from packages like segmentation_models_pytorch. It is NOT bundled in
      # the exe (excluded in DualAnnotator.spec) — training runs via an
      # external venv (see find_python() in mlops/utils.py).

      - name: Build Full version
        run: |
          pyinstaller DualAnnotator.spec

      - name: Zip Full build
        run: |
          Compress-Archive -Path dist\DualAnnotator -DestinationPath dist\DualAnnotator-Full.zip

      # ── Lite build (disabled — uncomment to release a new Lite build) ──
      # - name: Install Lite dependencies
      #   run: |
      #     pip install -r requirements-lite.txt
      #
      # - name: Create Lite marker
      #   run: |
      #     New-Item -ItemType File -Path "_lite_mode" -Force
      #
      # - name: Build Lite version
      #   run: |
      #     pyinstaller DualAnnotator_Lite.spec
      #
      # - name: Zip Lite build
      #   run: |
      #     Compress-Archive -Path dist\DualAnnotator_Lite -DestinationPath dist\DualAnnotator-Lite.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DualAnnotator-Full.zip
            # dist/DualAnnotator-Lite.zip
          body: |
            ## DualAnnotator ${{ github.ref_name }}

            ### How to use
            1. Download **DualAnnotator-Full.zip**
            2. Extract anywhere
            3. Double-click **DualAnnotator.exe** — GUI works immediately

            ### Training setup (one-time)
            The app sets this up for you automatically — click **Start Training** and
            choose "Yes" when prompted to install the AI Engine. It detects whether
            your machine has an NVIDIA GPU and installs the matching PyTorch build
            (CUDA or CPU) along with the other ML packages.

            If you'd rather set it up manually, open a terminal in the extracted folder and run:
            ```
            python -m venv venv
            venv\Scripts\activate
            pip install torch torchvision --index-url https://download.pytorch.org/whl/cu118
            REM Or, for CPU only:
            REM pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
            pip install pytorch-lightning segmentation-models-pytorch albumentations torchmetrics ultralytics onnxruntime
            ```

            ### Requirements
            - Windows 10 or later
            - [Visual C++ Redistributable](https://aka.ms/vs/17/release/vc_redist.x64.exe) (install if app doesn't start)
            - Python 3.11 (only needed for training venv setup)
