name: Build and Release DualAnnotator

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller==6.11.1
          pip install -r requirements-lite.txt

      # ── Lite build only ──
      - name: Create Lite marker
        run: |
          New-Item -ItemType File -Path "_lite_mode" -Force

      - name: Build Lite version
        run: |
          pyinstaller DualAnnotator_Lite.spec

      - name: Zip Lite build
        run: |
          Compress-Archive -Path dist\DualAnnotator_Lite -DestinationPath dist\DualAnnotator-Lite.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DualAnnotator-Lite.zip
          body: |
            ## DualAnnotator Lite ${{ github.ref_name }}

            Standalone annotation toolkit — no Python or setup required. Extract and run.

            ### Included
            - **Annotate** — Bounding box, polygon, bezier, circle, ellipse, ring annotations
            - **RAW → PNG** — Batch convert raw images with colormap and ROI support
            - **Coin Rotator** — Batch align coin images using SIFT feature matching
            - **Collaborate** — Host/join simultaneous annotation sessions

            ### How to use
            1. Download **DualAnnotator-Lite.zip**
            2. Extract anywhere
            3. Double-click **DualAnnotator_Lite.exe**

            > For the full version with ML training & inference, see the Full release.
